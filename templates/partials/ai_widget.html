<!-- Skill-Verse Floating AI Assistant Widget (Local Ollama Powered) -->
<style>
  .sv-ai-fab {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 1080;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #0c6c63, #14b8a6);
    color: #fff;
    font-size: 1.35rem;
    box-shadow: 0 10px 28px rgba(12, 108, 99, 0.35);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .sv-ai-fab:hover {
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 14px 32px rgba(12, 108, 99, 0.45);
  }
  .sv-ai-drawer {
    position: fixed;
    right: 22px;
    bottom: 88px;
    width: 360px;
    max-width: calc(100vw - 28px);
    height: 470px;
    max-height: calc(100vh - 120px);
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.22);
    z-index: 1080;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .sv-ai-drawer.open { display: flex; }
  .sv-ai-head {
    background: linear-gradient(135deg, #0c6c63, #0f766e);
    color: #fff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sv-ai-head-title { font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
  .sv-ai-badge {
    font-size: 0.68rem;
    background: rgba(255,255,255,0.18);
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .sv-ai-close {
    background: none;
    border: none;
    color: #fff;
    font-size: 1.25rem;
    cursor: pointer;
    line-height: 1;
  }
  .sv-ai-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 0.87rem;
  }
  .sv-ai-msg {
    padding: 10px 12px;
    border-radius: 12px;
    max-width: 88%;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .sv-ai-msg.bot {
    align-self: flex-start;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    color: #1e293b;
  }
  .sv-ai-msg.user {
    align-self: flex-end;
    background: #0e7d73;
    color: #ffffff;
  }
  .sv-ai-provider {
    font-size: 0.68rem;
    color: #0e7d73;
    font-weight: 700;
    margin-top: 4px;
  }
  .sv-ai-chips {
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    background: #ffffff;
    border-top: 1px solid #f1f5f9;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .sv-ai-chips::-webkit-scrollbar { display: none; }
  .sv-ai-chip {
    white-space: nowrap;
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    color: #0f172a;
    cursor: pointer;
    flex-shrink: 0;
  }
  .sv-ai-chip:hover { border-color: #0e7d73; color: #0e7d73; }
  .sv-ai-foot {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: #ffffff;
    border-top: 1px solid #e2e8f0;
  }
  .sv-ai-foot input {
    flex: 1;
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.85rem;
    outline: none;
  }
  .sv-ai-foot input:focus { border-color: #0e7d73; }
  .sv-ai-foot button {
    background: #0e7d73;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 0 16px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }
  @media (max-width: 768px) {
    .sv-ai-fab { bottom: 16px; right: 16px; width: 50px; height: 50px; }
    .sv-ai-drawer { bottom: 76px; right: 14px; }
  }
</style>

<button type="button" class="sv-ai-fab" id="svAiFab" title="Ask Skye (Local Ollama AI)">
  <i class="fa-solid fa-robot"></i>
</button>

<div class="sv-ai-drawer" id="svAiDrawer" aria-hidden="true">
  <div class="sv-ai-head">
    <div class="sv-ai-head-title">
      <i class="fa-solid fa-sparkles"></i> Skye AI
      <span class="sv-ai-badge">Local Ollama</span>
    </div>
    <button type="button" class="sv-ai-close" id="svAiClose" aria-label="Close AI assistant">&times;</button>
  </div>
  <div class="sv-ai-body" id="svAiBody">
    <div class="sv-ai-msg bot">
      👋 Hi! I'm <strong>Skye</strong>, running on <strong>Local Ollama</strong> (no Gemini API key). Ask me about skills, learning roadmaps, or finding a swap partner!
    </div>
  </div>
  <div class="sv-ai-chips">
    <button type="button" class="sv-ai-chip" data-q="Suggest a Python learning roadmap">🐍 Python roadmap</button>
    <button type="button" class="sv-ai-chip" data-q="How do I swap skills on Skill-Verse?">🤝 How swaps work</button>
    <button type="button" class="sv-ai-chip" data-q="What UI/UX skills should I learn?">🎨 UI/UX skills</button>
  </div>
  <form class="sv-ai-foot" id="svAiForm">
    <input type="text" id="svAiInput" placeholder="Ask Skye anything..." autocomplete="off">
    <button type="submit">Send</button>
  </form>
</div>

<script>
(function () {
  const fab = document.getElementById('svAiFab');
  const drawer = document.getElementById('svAiDrawer');
  const closeBtn = document.getElementById('svAiClose');
  const form = document.getElementById('svAiForm');
  const input = document.getElementById('svAiInput');
  const body = document.getElementById('svAiBody');
  if (!fab || !drawer) return;

  function toggleDrawer(open) {
    const isOpen = typeof open === 'boolean' ? open : !drawer.classList.contains('open');
    drawer.classList.toggle('open', isOpen);
    drawer.setAttribute('aria-hidden', String(!isOpen));
    if (isOpen && input) setTimeout(() => input.focus(), 100);
  }

  fab.addEventListener('click', () => toggleDrawer());
  closeBtn.addEventListener('click', () => toggleDrawer(false));

  async function sendQuestion(text) {
    if (!text) return;
    const uDiv = document.createElement('div');
    uDiv.className = 'sv-ai-msg user';
    uDiv.textContent = text;
    body.appendChild(uDiv);

    const loading = document.createElement('div');
    loading.className = 'sv-ai-msg bot';
    loading.textContent = 'Thinking with Local Ollama...';
    body.appendChild(loading);
    body.scrollTop = body.scrollHeight;

    try {
      const res = await fetch('/chat/api/send/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, provider: 'ollama' })
      });
      const data = await res.json();
      loading.textContent = data.response || data.error || 'No response received.';
      if (data.provider_used) {
        const meta = document.createElement('div');
        meta.className = 'sv-ai-provider';
        meta.textContent = '⚡ ' + data.provider_used;
        loading.appendChild(meta);
      }
    } catch (err) {
      loading.textContent = 'Could not reach AI endpoint: ' + err.message;
    }
    body.scrollTop = body.scrollHeight;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const val = input.value.trim();
    if (!val) return;
    input.value = '';
    sendQuestion(val);
  });

  document.querySelectorAll('.sv-ai-chip').forEach(btn => {
    btn.addEventListener('click', () => sendQuestion(btn.dataset.q));
  });
})();
</script>
