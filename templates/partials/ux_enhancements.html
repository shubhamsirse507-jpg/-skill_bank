<!-- Skill-Verse Shared Dark Mode & Auto-Dismiss Toast System -->
<style>
  /* Theme toggle button */
  .sv-theme-btn {
    background: transparent;
    border: 1px solid #e2e8f0;
    color: #374151;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }
  .sv-theme-btn:hover { background: #f0faf9; color: #0e7d73; border-color: #0e7d73; }

  /* Floating toast container */
  .sv-toast-stack {
    position: fixed;
    top: 76px;
    right: 20px;
    z-index: 1200;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 360px;
    width: calc(100vw - 32px);
    pointer-events: none;
  }
  .sv-toast {
    pointer-events: auto;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 0.88rem;
    font-weight: 600;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    animation: svToastIn 0.25s ease both;
  }
  .sv-toast.success { background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7; }
  .sv-toast.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
  .sv-toast.info    { background: #eff6ff; color: #1e40af; border: 1px solid #93c5fd; }
  .sv-toast-close {
    background: none; border: none; color: inherit; font-size: 1.15rem; cursor: pointer; line-height: 1;
  }
  @keyframes svToastIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Dark Mode Palette */
  body.sv-dark {
    background: #0b1120 !important;
    color: #e2e8f0 !important;
  }
  body.sv-dark .base-navbar,
  body.sv-dark .sb-navbar {
    background: #0f172a !important;
    border-bottom-color: #1e293b !important;
  }
  body.sv-dark .nav-icon-btn,
  body.sv-dark .sb-icon-btn,
  body.sv-dark .sv-theme-btn {
    color: #cbd5e1 !important;
    border-color: #334155 !important;
  }
  body.sv-dark .dashboard-bg,
  body.sv-dark .page-bg {
    background: #0b1120 !important;
  }
  body.sv-dark .stat-card-pro,
  body.sv-dark .skill-card-item,
  body.sv-dark .search-filter-box,
  body.sv-dark .no-results-box,
  body.sv-dark .sv-onboard-card,
  body.sv-dark .card,
  body.sv-dark .sv-ai-drawer,
  body.sv-dark .sv-ai-foot,
  body.sv-dark .sv-ai-chips {
    background: #111827 !important;
    color: #e2e8f0 !important;
    border-color: #1f2937 !important;
  }
  body.sv-dark .sv-ai-body { background: #0b1120 !important; }
  body.sv-dark .sv-ai-msg.bot { background: #1e293b !important; color: #e2e8f0 !important; border-color: #334155 !important; }
  body.sv-dark input,
  body.sv-dark select,
  body.sv-dark textarea {
    background: #1e293b !important;
    color: #f1f5f9 !important;
    border-color: #334155 !important;
  }
  body.sv-dark h1, body.sv-dark h2, body.sv-dark h3, body.sv-dark h4,
  body.sv-dark .stat-number-pro,
  body.sv-dark .skill-card-item h3 {
    color: #f8fafc !important;
  }
  body.sv-dark p, body.sv-dark .text-muted, body.sv-dark .stat-label-pro {
    color: #94a3b8 !important;
  }
</style>

<script>
(function () {
  const saved = localStorage.getItem('sv_theme');
  if (saved === 'dark') document.body.classList.add('sv-dark');

  function syncThemeIcons() {
    const isDark = document.body.classList.contains('sv-dark');
    document.querySelectorAll('#svThemeToggle i, .sv-theme-btn i').forEach(icon => {
      icon.className = isDark ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    syncThemeIcons();
    document.querySelectorAll('#svThemeToggle, .sv-theme-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        document.body.classList.toggle('sv-dark');
        localStorage.setItem('sv_theme', document.body.classList.contains('sv-dark') ? 'dark' : 'light');
        syncThemeIcons();
      });
    });

    // Auto-dismiss floating toasts after 4.5s
    document.querySelectorAll('.sv-toast').forEach(toast => {
      setTimeout(() => {
        toast.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 350);
      }, 4500);
    });
  });
})();
</script>
