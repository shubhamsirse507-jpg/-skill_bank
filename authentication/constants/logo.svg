<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle inner border overlay -->
  <rect x="14" y="14" width="172" height="172" rx="40" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Skill Bank Lightbulb & Puzzle Icon -->
  <g transform="translate(100, 95)" filter="url(#glow)">
    <!-- Lightbulb Outer Curve -->
    <path d="M 0 -48 C -26 -48 -44 -30 -44 -4 C -44 14 -32 26 -22 36 L -22 44 C -22 47 -19 50 -15 50 L 15 50 C 19 50 22 47 22 44 L 22 36 C 32 26 44 14 44 -4 C 44 -30 26 -48 0 -48 Z" 
          fill="url(#bulbGrad)" />
    
    <!-- Lightbulb Filament (Puzzle/Skill Connection) -->
    <path d="M -12 -12 Q 0 -28 12 -12 T 0 16" 
          fill="none" stroke="#6d28d9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bulb Base Lines -->
    <rect x="-16" y="54" width="32" height="6" rx="3" fill="#ffffff" />
    <rect x="-12" y="64" width="24" height="5" rx="2.5" fill="#fef08a" opacity="0.9" />

    <!-- Radiant Skill Rays -->
    <line x1="0" y1="-60" x2="0" y2="-68" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="-42" y1="-42" x2="-48" y2="-48" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="42" y1="-42" x2="48" y2="-48" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="-54" y1="-4" x2="-62" y2="-4" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="54" y1="-4" x2="62" y2="-4" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
