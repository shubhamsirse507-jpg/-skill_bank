{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Skill Bank</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
        height: 100vh; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden; padding: 20px;
        background: linear-gradient(180deg, #6ddfd5 0%, #fbfefe 100%);
        background-attachment: fixed;
    }
    .box {
        background: rgba(255,255,255,.85); backdrop-filter: blur(14px);
        padding: 40px 35px; border-radius: 16px;
        box-shadow: 0 8px 40px rgba(12,108,99,.12);
        border: 1px solid rgba(0,0,0,.08); width: 100%; max-width: 440px;
    }
    h2 { font-size: 22px; color: #1a1a2e; margin-bottom: 8px; }
    p.sub { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type=password] {
        width: 100%; padding: 12px 14px; border: 1.5px solid #d1d5db;
        border-radius: 10px; font-size: 14px; outline: none; transition: border-color .2s;
    }
    input[type=password]:focus { border-color: #0e7d73; }
    .btn {
        width: 100%; padding: 13px; background: linear-gradient(135deg,#0e7d73,#16a38b);
        color: white; border: none; border-radius: 10px; font-size: 15px;
        font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    .btn:hover { opacity: .92; }
    .msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
    .msg.error { background: #fee2e2; color: #991b1b; }
    .msg.success { background: #d1fae5; color: #065f46; }
    .back { text-align: center; margin-top: 18px; font-size: 13px; }
    .back a { color: #0e7d73; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="box">
    <div style="text-align:center;margin-bottom:20px;">
        <span style="font-size:48px;">🔒</span>
        <h2>Set New Password</h2>
        <p class="sub">Choose a strong password for your Skill Bank account.</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="msg {% if message.tags == 'error' %}error{% else %}success{% endif %}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'reset_password' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required
                   placeholder="Min. 8 characters" minlength="8">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required
                   placeholder="Repeat your new password">
        </div>
        <button type="submit" class="btn">🔐 Reset Password</button>
    </form>

    <div class="back">
        Remember your password? <a href="{% url 'login' %}">Sign in</a>
    </div>
</div>
<script>
document.querySelector('form').addEventListener('submit', function(e) {
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('confirm_password').value;
    if (p1 !== p2) {
        e.preventDefault();
        alert('Passwords do not match. Please try again.');
    }
});
</script>
</body>
</html>
