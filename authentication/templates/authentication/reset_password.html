{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password - Skill-Verse</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: linear-gradient(180deg, #6ddfd5 0%, #fbfefe 100%);
        background-attachment: fixed;
        gap: 18px;
    }

    .brand-header {
        display: flex;
        align-items: center;
        gap: 14px;
        animation: slideUp 0.35s ease both;
    }

    .brand-logo-icon {
        width: 54px;
        height: 54px;
        min-width: 54px;
        background: #0e7d73;
        color: #ffffff;
        border-radius: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 900;
        font-family: 'Outfit', sans-serif;
        box-shadow: 0 4px 16px rgba(14,125,115,0.35);
        flex-shrink: 0;
    }

    .brand-title {
        font-family: 'Outfit', sans-serif;
        font-size: 2rem;
        font-weight: 800;
        color: #0c6c63;
        letter-spacing: -0.5px;
    }

    .reset-card {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border-radius: 24px;
        padding: 36px 32px 32px;
        box-shadow: 0 12px 48px rgba(12,108,99,0.14), 0 4px 16px rgba(0,0,0,0.06);
        animation: slideUp 0.4s ease both;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .icon-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 60px;
        border-radius: 18px;
        background: linear-gradient(135deg, #0c6c63 0%, #16a38b 100%);
        margin: 0 auto 16px;
        box-shadow: 0 8px 24px rgba(12,108,99,0.25);
    }

    .icon-badge svg {
        width: 28px;
        height: 28px;
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .reset-card h1 {
        font-family: 'Outfit', sans-serif;
        font-size: 1.65rem;
        font-weight: 800;
        color: #0f172a;
        text-align: center;
        margin-bottom: 6px;
    }

    .reset-card p.subtitle {
        font-size: 0.88rem;
        color: #64748b;
        text-align: center;
        margin-bottom: 22px;
        line-height: 1.5;
    }

    .alert {
        padding: 11px 14px;
        border-radius: 10px;
        font-size: 0.84rem;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        line-height: 1.4;
    }

    .alert-error {
        background: #fef2f2;
        color: #991b1b;
        border: 1px solid #fecaca;
    }

    .input-group {
        margin-bottom: 16px;
    }

    .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.84rem;
        color: #334155;
        font-weight: 600;
    }

    .input-group input {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        font-size: 0.92rem;
        outline: none;
        background: #f8fafc;
        color: #0f172a;
        transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .input-group input:focus {
        border-color: #0c6c63;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(12,108,99,0.10);
    }

    .submit-btn {
        width: 100%;
        padding: 14px;
        background: #0c6c63;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        margin-top: 6px;
        transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        box-shadow: 0 4px 16px rgba(12,108,99,0.28);
    }

    .submit-btn:hover {
        background: #09544d;
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(12,108,99,0.35);
    }

    .submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .extra-links {
        text-align: center;
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid #f1f5f9;
        font-size: 0.85rem;
        color: #64748b;
    }

    .extra-links a {
        color: #0c6c63;
        text-decoration: none;
        font-weight: 600;
    }

    .extra-links a:hover {
        text-decoration: underline;
        color: #09544d;
    }

    @media (max-width: 480px) {
        body { padding: 12px; }
        .reset-card { padding: 24px 18px; }
    }
</style>
</head>
<body>

<div class="brand-header">
    <div class="brand-logo-icon">S</div>
    <span class="brand-title">Skill-Verse</span>
</div>

<div class="reset-card">
    <div class="icon-badge">
        <svg viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
    </div>

    <h1>Set New Password</h1>
    <p class="subtitle">Create a strong password for your Skill-Verse account.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-error">
                ⚠️ <span>{{ message }}</span>
            </div>
        {% endfor %}
    {% endif %}

    <div class="alert alert-error" id="clientError" style="display:none;"></div>

    <form id="resetForm" method="POST" action="{% url 'reset_password' %}">
        {% csrf_token %}

        <div class="input-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required placeholder="Min. 6 characters" minlength="6" autocomplete="new-password" autofocus>
        </div>

        <div class="input-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repeat your new password" minlength="6" autocomplete="new-password">
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Update Password & Sign In</button>

        <div class="extra-links">
            Remembered your password? <a href="{% url 'login' %}">Sign in</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('resetForm').addEventListener('submit', function(e) {
        const p1 = document.getElementById('password').value;
        const p2 = document.getElementById('confirm_password').value;
        const errEl = document.getElementById('clientError');

        if (p1.length < 6) {
            e.preventDefault();
            errEl.textContent = '⚠️ Password must be at least 6 characters long.';
            errEl.style.display = 'flex';
            return;
        }

        if (p1 !== p2) {
            e.preventDefault();
            errEl.textContent = '⚠️ Passwords do not match. Please verify and try again.';
            errEl.style.display = 'flex';
            return;
        }

        errEl.style.display = 'none';
        const btn = document.getElementById('submitBtn');
        btn.textContent = 'Updating Password…';
        btn.disabled = true;
    });
</script>

</body>
</html>
