{% load static %}
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Skill Bank</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        padding: 20px;
    }

    /* ── Video Background ── */
    .video-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
    }

    /* ── Dark Overlay ── */
    .video-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.45);
        z-index: -1;
    }

    /* ── Forgot Password Card ── */
    .forgot-box {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: 40px 35px;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 100%;
        max-width: 380px;
    }

    .forgot-box h2 {
        text-align: center;
        margin-bottom: 8px;
        color: #fff;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .forgot-box p.subtitle {
        text-align: center;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.75);
        margin-bottom: 25px;
        line-height: 1.5;
    }

    .input-group {
        margin-bottom: 18px;
    }

    .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 500;
    }

    .input-group input {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        transition: border 0.2s, background 0.2s;
    }

    .input-group input::placeholder {
        color: rgba(255, 255, 255, 0.55);
    }

    .input-group input:focus {
        border-color: #a78bfa;
        background: rgba(255, 255, 255, 0.22);
    }

    .reset-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #764ba2, #667eea);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
        letter-spacing: 0.4px;
    }

    .reset-btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }

    .reset-btn:active {
        transform: translateY(0);
    }

    .success-msg {
        display: none;
        background: rgba(30, 126, 66, 0.35);
        color: #b6e9c6;
        border: 1px solid rgba(182, 233, 198, 0.4);
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 18px;
        backdrop-filter: blur(4px);
    }

    .extra-links {
        text-align: center;
        margin-top: 18px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.8);
    }

    .extra-links a {
        color: #a78bfa;
        text-decoration: none;
        font-weight: 500;
    }

    .extra-links a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

<!-- Background Video -->
<video class="video-bg" autoplay muted loop playsinline>
    <source src="{{ bg_video_url }}" type="video/mp4">
</video>

<!-- Dark Overlay -->
<div class="video-overlay"></div>

<div class="forgot-box">
    <h2>Forgot Password</h2>
    <p class="subtitle">Enter your registered email and we'll send you a link to reset your password.</p>

    <div class="success-msg" id="successMsg">
        Reset link sent! Check your email inbox.
    </div>

    <form id="forgotForm">
        {% csrf_token %}
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <button type="submit" class="reset-btn">Send Reset Link</button>
        <div class="extra-links">
            Remembered your password? <a href="{% url 'login' %}">Login</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('forgotForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const successMsg = document.getElementById('successMsg');

        // Replace this with your actual password reset API call
        successMsg.style.display = 'block';
        document.getElementById('forgotForm').reset();
    });
</script>

</body>
</html>
