{% load static %}
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Skill Bank</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
        position: relative;
        padding: 30px 20px;
    }

    /* ── Video Background ── */
    .video-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
    }

    /* ── Dark Overlay ── */
    .video-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.45);
        z-index: -1;
    }

    /* ── Register Card ── */
    .register-box {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: 40px 35px;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 100%;
        max-width: 400px;
        margin: auto;
    }

    .register-box h2 {
        text-align: center;
        margin-bottom: 6px;
        color: #fff;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .register-box p.subtitle {
        text-align: center;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.75);
        margin-bottom: 24px;
    }

    .input-group {
        margin-bottom: 16px;
    }

    .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 500;
    }

    .input-group input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        transition: border 0.2s, background 0.2s;
    }

    .input-group input::placeholder {
        color: rgba(255, 255, 255, 0.55);
    }

    .input-group input:focus {
        border-color: #a78bfa;
        background: rgba(255, 255, 255, 0.22);
    }

    .error-msg {
        font-size: 12px;
        color: #fca5a5;
        margin-top: 4px;
        display: none;
    }

    .register-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #764ba2, #667eea);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
        transition: opacity 0.2s, transform 0.1s;
        letter-spacing: 0.4px;
    }

    .register-btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }

    .register-btn:active {
        transform: translateY(0);
    }

    .extra-links {
        text-align: center;
        margin-top: 18px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.8);
    }

    .extra-links a {
        color: #a78bfa;
        text-decoration: none;
        font-weight: 500;
    }

    .extra-links a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

<!-- Background Video -->
<video class="video-bg" autoplay muted loop playsinline crossorigin="anonymous">
    <source src="{{ bg_video_url }}" type="video/mp4">
    <source src="{% static 'bg_video.mp4' %}" type="video/mp4">
    <source src="https://videos.pexels.com/video-files/8675543/8675543-hd_1920_1080_30fps.mp4" type="video/mp4">
</video>

<!-- Dark Overlay -->
<div class="video-overlay"></div>

<div class="register-box">
    <h2>Create Account</h2>
    <p class="subtitle">Sign up to get started</p>
    <form id="registerForm">
        {% csrf_token %}
        <div class="input-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </div>
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required minlength="6">
        </div>
        <div class="input-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required minlength="6">
            <div class="error-msg" id="matchError">Passwords do not match</div>
        </div>
        <button type="submit" class="register-btn">Register</button>
        <div class="extra-links">
            Already have an account? <a href="{% url 'login' %}">Login</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const matchError = document.getElementById('matchError');

        if (password !== confirmPassword) {
            matchError.style.display = 'block';
            return;
        }
        matchError.style.display = 'none';

        const fullname = document.getElementById('fullname').value;
        const email = document.getElementById('email').value;
        const username = document.getElementById('username').value;

        alert('Registered: ' + fullname + ' (' + username + ')');
        // Replace this with your actual registration API call
    });
</script>

</body>
</html>
