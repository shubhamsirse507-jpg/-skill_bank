{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Bank Login</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
        height: 100vh;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #6ddfd5 0%, #fbfefe 100%);
        background-attachment: fixed;
        overflow: hidden;
    }

    /* Brand */
    .auth-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 390px;
        padding: 20px;
    }

    .brand-header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
    }

    .brand-logo-img {
        width: 58px; height: 58px;
        object-fit: contain;
        animation: float 4s ease-in-out infinite alternate;
    }

    @keyframes float {
        from { transform: translateY(0); }
        to   { transform: translateY(-6px); }
    }

    .brand-title {
        font-family: 'Outfit', sans-serif;
        font-size: 38px;
        font-weight: 800;
        color: #0c6c63;
    }

    /* Card */
    .login-box {
        width: 100%;
        background: rgba(255,255,255,0.75);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(0,0,0,0.08);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 8px 40px rgba(12,108,99,0.12);
    }

    .page-title {
        color: #1e293b;
        font-size: 22px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 26px;
    }

    /* Inputs */
    .input-group { margin-bottom: 18px; }

    .input-group label {
        display: block;
        color: #44556a;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 7px;
    }

    .input-group input {
        width: 100%;
        padding: 12px 16px;
        background: rgba(255,255,255,0.9);
        border: 1px solid rgba(0,0,0,0.12);
        border-radius: 10px;
        color: #1e293b;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input::placeholder { color: #94a3b8; }

    .input-group input:focus {
        border-color: #0c6c63;
        box-shadow: 0 0 0 4px rgba(12,108,99,0.12);
    }

    /* Button */
    .login-btn {
        width: 100%;
        padding: 13px;
        margin-top: 6px;
        background: #0c6c63;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 15px rgba(12,108,99,0.3);
    }

    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 22px rgba(124,58,237,0.45);
    }

    .login-btn:active { transform: translateY(0); }

    /* Error */
    .error-alert {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(239,68,68,0.18);
        border: 1px solid rgba(239,68,68,0.45);
        color: #fca5a5;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 13px;
        margin-bottom: 18px;
        animation: shake 0.4s ease;
    }

    .error-alert svg { width: 18px; height: 18px; fill: #f87171; flex-shrink: 0; }

    @keyframes shake {
        0%   { transform: translateX(-6px); opacity: 0; }
        40%  { transform: translateX(6px); }
        70%  { transform: translateX(-3px); }
        100% { transform: translateX(0); opacity: 1; }
    }

    /* Links */
    .extra-links {
        display: flex;
        justify-content: space-between;
        margin-top: 18px;
        font-size: 13px;
    }

    .extra-links a {
        color: #0c6c63;
        font-weight: 600;
        text-decoration: none;
        transition: color 0.2s;
    }

    .extra-links a:hover { color: #09544d; text-decoration: underline; }
</style>
</head>
<body>

<div class="auth-container">

    <div class="brand-header">
        <img src="{% static brand_logo_image_name %}" alt="Skill Bank Logo" class="brand-logo-img">
        <h1 class="brand-title">Skill Bank</h1>
    </div>

    <div class="login-box">
        <h2 class="page-title">Login</h2>

        <form id="loginForm" method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">

            {% if error %}
            <div class="error-alert" role="alert">
                <svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Login</button>

            <div class="extra-links">
                <a href="{% url 'forgot_password' %}">Forgot password?</a>
                <a href="{% url 'register' %}">Register</a>
            </div>
        </form>
    </div>

</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function () {
        const btn = document.getElementById('loginBtn');
        btn.textContent = 'Logging in…';
        btn.disabled = true;
        btn.style.opacity = '0.75';
    });
</script>

</body>
</html>
