{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Bank Login</title>
<!-- Google Fonts: Outfit -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        background: #0f172a;
    }

    /* ── Video Background ── */
    .video-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
    }

    /* ── Dark Overlay ── */
    .video-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.45);
        z-index: -1;
        pointer-events: none;
    }

    /* ── Glassmorphism Card ── */
    .login-box {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: 45px 40px;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 100%;
        max-width: 390px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-box:hover {
        box-shadow: 0 25px 60px rgba(99, 102, 241, 0.35),
                    0 6px 24px rgba(0, 0, 0, 0.3);
    }

    .auth-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 390px;
        z-index: 1;
    }

    .brand-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-bottom: 24px;
    }
    .brand-header .logo svg,
    .brand-logo-img {
        width: 58px;
        height: 58px;
        object-fit: contain;
        filter: drop-shadow(0 4px 12px rgba(99, 102, 241, 0.25));
        animation: floatLogo 4s ease-in-out infinite alternate;
    }


    @keyframes floatLogo {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
    }

    .brand-title {
        font-family: 'Outfit', sans-serif;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: 1.2px;
        background: linear-gradient(135deg, #c7d2fe 0%, #a5b4fc 50%, #818cf8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 8px rgba(99, 102, 241, 0.4));
    }
    
    .page-title {
        text-align: center;
        color: #fff;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 26px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 600;
        letter-spacing: 0.3px;
    }

    .input-group input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        font-size: 14px;
        outline: none;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        transition: all 0.25s ease;
    }

    .input-group input::placeholder {
        color: rgba(255, 255, 255, 0.55);
    }

    .input-group input:focus {
        border-color: #a78bfa;
        background: rgba(255, 255, 255, 0.22);
        box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.15);
    }

    .login-btn {
        width: 100%;
        padding: 13px;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #9333ea 100%);
        background-size: 200% auto;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 6px;
        letter-spacing: 0.6px;
        box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
    }

    .login-btn:hover {
        background-position: right center;
        box-shadow: 0 6px 22px rgba(124, 58, 237, 0.45);
        transform: translateY(-2px);
    }

    .login-btn:active {
        transform: translateY(0);
    }

    .extra-links {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        font-size: 13px;
    }

    .extra-links a {
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
    }

    .extra-links a:hover {
        color: #c4b5fd;
        text-decoration: underline;
    }
</style>
</head>
<body>

    <!-- Background Video -->
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="{{ bg_video_url }}" type="video/mp4">
    </video>

    <!-- Dark Overlay -->
    <div class="video-overlay"></div>

    <div class="auth-container">

        <div class="brand-header">
            <div class="logo">
                <img src="{% static brand_logo_image_name %}" alt="Skill Bank Logo" class="brand-logo-img">
            </div>
            <h1 class="brand-title">Skill Bank</h1>
        </div>


        <div class="login-box">
            <h2 class="page-title">Login</h2>
            <form id="loginForm">
                {% csrf_token %}
                <div class="input-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>
                <button type="submit" class="login-btn">Login</button>
                <div class="extra-links">
                    <a href="{% url 'forgot_password' %}">Forgot password?</a>
                    <a href="{% url 'register' %}">Register</a>
                </div>
            </form>
        </div>

    </div>


<script>
    // Login Form Handler
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        alert('Login submitted for: ' + username);
    });
</script>

</body>
</html>
