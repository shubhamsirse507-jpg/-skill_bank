<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI_Chat_Boat – Your intelligent AI-powered chat assistant. Experience seamless, smart conversations in a stunning modern interface." />
  <title>AI Chat Boat | Your Intelligent AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated Background -->
  <div class="bg-canvas" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Particles -->
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <!-- App Shell -->
  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" role="complementary" aria-label="Chat history and settings">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="18" cy="18" r="17" stroke="url(#brandGrad)" stroke-width="2"/>
              <path d="M10 18 Q18 8 26 18 Q18 28 10 18Z" fill="url(#brandGrad)" opacity="0.8"/>
              <circle cx="14" cy="16" r="2" fill="#fff"/>
              <circle cx="22" cy="16" r="2" fill="#fff"/>
              <defs>
                <linearGradient id="brandGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#7c3aed"/>
                  <stop offset="100%" stop-color="#06b6d4"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <span class="brand-name">AI Chat Boat</span>
        </div>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <button class="new-chat-btn" id="newChatBtn" aria-label="Start new chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New Chat
      </button>

      <div class="sidebar-section-label">Recent Chats</div>
      <nav class="chat-history" id="chatHistory" aria-label="Recent conversations">
        <button class="history-item active" id="hist-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <div class="history-item-info">
            <span class="history-item-title">Getting Started</span>
            <span class="history-item-time">Just now</span>
          </div>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-section-label">Settings</div>
        <div class="model-selector-wrap">
          <label for="modelSelector" class="model-label">AI Model</label>
          <div class="custom-select-wrap">
            <select id="modelSelector" class="model-selector" aria-label="Select AI model">
              <option value="gpt4">GPT-4 Turbo</option>
              <option value="claude">Claude 3.5 Sonnet</option>
              <option value="gemini" selected>Gemini 1.5 Pro</option>
              <option value="mistral">Mistral Large</option>
            </select>
            <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="sidebar-actions">
          <button class="sidebar-action-btn" id="themeToggleBtn" aria-label="Toggle theme">
            <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <span>Dark Mode</span>
          </button>
          <button class="sidebar-action-btn" id="clearHistoryBtn" aria-label="Clear chat history">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            <span>Clear History</span>
          </button>
        </div>
        <div class="user-profile">
          <div class="user-avatar" aria-hidden="true">U</div>
          <div class="user-info">
            <span class="user-name">You</span>
            <span class="user-plan">Free Plan</span>
          </div>
          <button class="upgrade-btn" aria-label="Upgrade plan">✦ Pro</button>
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-main" role="main">

      <!-- Top Bar -->
      <header class="topbar" role="banner">
        <button class="topbar-menu-btn" id="sidebarToggleBtn" aria-label="Toggle sidebar" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-title">
          <div class="ai-status-dot" aria-label="AI is online" title="AI Online"></div>
          <h1>AI Chat Boat</h1>
          <span class="ai-version-badge">v2.0</span>
        </div>
        <div class="topbar-actions">
          <button class="topbar-action-btn" id="topShareBtn" aria-label="Share conversation" title="Share">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </button>
          <button class="topbar-action-btn" id="topExportBtn" aria-label="Export conversation" title="Export">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
        </div>
      </header>

      <!-- Messages Container -->
      <div class="messages-container" id="messagesContainer" role="log" aria-live="polite" aria-label="Chat messages">

        <!-- Welcome Screen -->
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-avatar">
            <div class="avatar-ring"></div>
            <div class="avatar-inner">
              <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="32" cy="32" r="30" fill="url(#welcomeGrad)" opacity="0.15"/>
                <path d="M16 32 Q32 12 48 32 Q32 52 16 32Z" fill="url(#welcomeGrad)" opacity="0.9"/>
                <circle cx="26" cy="28" r="3.5" fill="white"/>
                <circle cx="38" cy="28" r="3.5" fill="white"/>
                <circle cx="27.5" cy="27" r="1.2" fill="#1a1a2e"/>
                <circle cx="39.5" cy="27" r="1.2" fill="#1a1a2e"/>
                <defs>
                  <linearGradient id="welcomeGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#7c3aed"/>
                    <stop offset="100%" stop-color="#06b6d4"/>
                  </linearGradient>
                </defs>
              </svg>
            </div>
          </div>
          <h2 class="welcome-title">Hello, I'm <span class="gradient-text">AI Chat Boat</span></h2>
          <p class="welcome-subtitle">Your intelligent conversational companion. Ask me anything — I'm here to help you think, create, and explore.</p>
          <div class="suggestion-grid" role="list" aria-label="Suggested prompts">
            <button class="suggestion-card" role="listitem" data-prompt="Explain quantum computing in simple terms">
              <div class="suggestion-icon">🔬</div>
              <div class="suggestion-text">
                <strong>Explain quantum computing</strong>
                <span>in simple, easy terms</span>
              </div>
            </button>
            <button class="suggestion-card" role="listitem" data-prompt="Write a Python function to sort a list using bubble sort">
              <div class="suggestion-icon">💻</div>
              <div class="suggestion-text">
                <strong>Write code for me</strong>
                <span>bubble sort in Python</span>
              </div>
            </button>
            <button class="suggestion-card" role="listitem" data-prompt="Give me 5 creative ideas for a mobile app startup">
              <div class="suggestion-icon">💡</div>
              <div class="suggestion-text">
                <strong>Brainstorm ideas</strong>
                <span>mobile app startup</span>
              </div>
            </button>
            <button class="suggestion-card" role="listitem" data-prompt="What are the best practices for modern web design in 2025?">
              <div class="suggestion-icon">🎨</div>
              <div class="suggestion-text">
                <strong>Web design trends</strong>
                <span>best practices 2025</span>
              </div>
            </button>
          </div>
        </div>

        <!-- Messages will be injected here -->
        <div class="messages-list" id="messagesList" role="list" aria-label="Conversation"></div>

      </div>

      <!-- Input Area -->
      <footer class="input-area" role="contentinfo">
        <div class="input-toolbar">
          <button class="tool-btn" id="attachBtn" aria-label="Attach file" title="Attach File">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <button class="tool-btn" id="imageBtn" aria-label="Add image" title="Image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
        </div>
        <div class="input-box-wrap">
          <textarea
            id="messageInput"
            class="message-input"
            placeholder="Message AI Chat Boat…"
            rows="1"
            aria-label="Type your message"
            aria-multiline="true"
            maxlength="8000"
          ></textarea>
          <div class="input-meta">
            <span class="char-count" id="charCount" aria-live="polite">0 / 8000</span>
          </div>
        </div>
        <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
          <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          <div class="send-spinner" aria-hidden="true"></div>
        </button>
      </footer>
      <div class="input-disclaimer" aria-label="Disclaimer">AI Chat Boat can make mistakes. Consider checking important information.</div>

    </main>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <!-- Overlay for mobile sidebar -->
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
