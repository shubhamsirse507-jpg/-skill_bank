<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #6ddfd5 0%, #fbfefe 100%);
        background-attachment: fixed;
        padding: 20px;
    }

    .register-box {
        background: #fff;
        padding: 40px 35px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 380px;
    }

    .register-box h2 {
        text-align: center;
        margin-bottom: 8px;
        color: #333;
    }

    .register-box p.subtitle {
        text-align: center;
        font-size: 13px;
        color: #888;
        margin-bottom: 25px;
    }

    .input-group {
        margin-bottom: 16px;
    }

    .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #555;
    }

    .input-group input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
        transition: border 0.2s;
    }

    .input-group input:focus {
        border-color: #764ba2;
    }

    .error-msg {
        font-size: 12px;
        color: #e04b4b;
        margin-top: 4px;
        display: none;
    }

    .register-btn {
        width: 100%;
        padding: 11px;
        background: #0c6c63;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        margin-top: 6px;
        transition: background 0.2s;
    }

    .register-btn:hover {
        background: #09544d;
    }

    .extra-links {
        text-align: center;
        margin-top: 18px;
        font-size: 13px;
    }

    .extra-links a {
        color: #764ba2;
        text-decoration: none;
    }

    .extra-links a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

<div class="register-box">
    <h2>Create Account</h2>
    <p class="subtitle">Sign up to get started</p>
    <form id="registerForm">
        <div class="input-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="Enter your full name" required>
        </div>
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password" required minlength="6">
        </div>
        <div class="input-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter your password" required minlength="6">
            <div class="error-msg" id="matchError">Passwords do not match</div>
        </div>
        <button type="submit" class="register-btn">Register</button>
        <div class="extra-links">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const matchError = document.getElementById('matchError');

        if (password !== confirmPassword) {
            matchError.style.display = 'block';
            return;
        }
        matchError.style.display = 'none';

        const fullname = document.getElementById('fullname').value;
        const email = document.getElementById('email').value;
        const username = document.getElementById('username').value;

        alert('Registered: ' + fullname + ' (' + username + ')');
        // Replace this with your actual registration API call
    });
</script>

</body>
</html>
