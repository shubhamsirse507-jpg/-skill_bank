<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        padding: 20px;
    }

    .forgot-box {
        background: #fff;
        padding: 40px 35px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 380px;
    }

    .forgot-box h2 {
        text-align: center;
        margin-bottom: 8px;
        color: #333;
    }

    .forgot-box p.subtitle {
        text-align: center;
        font-size: 13px;
        color: #888;
        margin-bottom: 25px;
        line-height: 1.5;
    }

    .input-group {
        margin-bottom: 18px;
    }

    .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #555;
    }

    .input-group input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
        transition: border 0.2s;
    }

    .input-group input:focus {
        border-color: #764ba2;
    }

    .reset-btn {
        width: 100%;
        padding: 11px;
        background: #764ba2;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.2s;
    }

    .reset-btn:hover {
        background: #5f3d87;
    }

    .success-msg {
        display: none;
        background: #e9f9ee;
        color: #1e7e42;
        border: 1px solid #b6e9c6;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 18px;
    }

    .extra-links {
        text-align: center;
        margin-top: 18px;
        font-size: 13px;
    }

    .extra-links a {
        color: #764ba2;
        text-decoration: none;
    }

    .extra-links a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

<div class="forgot-box">
    <h2>Forgot Password</h2>
    <p class="subtitle">Enter your registered email and we'll send you a link to reset your password.</p>

    <div class="success-msg" id="successMsg">
        Reset link sent! Check your email inbox.
    </div>

    <form id="forgotForm">
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <button type="submit" class="reset-btn">Send Reset Link</button>
        <div class="extra-links">
            Remembered your password? <a href="login.html">Login</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('forgotForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const successMsg = document.getElementById('successMsg');

        // Replace this with your actual password reset API call
        successMsg.style.display = 'block';
        document.getElementById('forgotForm').reset();
    });
</script>

</body>
</html>
