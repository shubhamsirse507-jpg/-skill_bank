# render.yaml — Blueprint deployment config for Render.com
services:
  - type: web
    name: skillbank-platform
    env: python
    region: singapore
    buildCommand: "./build.sh"
    startCommand: "gunicorn skill_bank.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
