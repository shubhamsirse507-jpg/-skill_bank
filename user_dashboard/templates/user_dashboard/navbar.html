{% load static %}

<nav class="navbar bg-white shadow-sm py-3">
    <div class="container-fluid">

        <div class="row align-items-center w-100">

           <!-- Logo + Hamburger -->
<div class="col-8 col-md-3 d-flex align-items-center">

    <!-- Mobile Sidebar Toggle -->
    <button class="btn d-lg-none me-2"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#sidebarMenu"
            aria-controls="sidebarMenu">

        <i class="bi bi-list fs-2"></i>

    </button>

    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center fw-bold text-success fs-3"
       href="{% url 'home' %}">
        SkillBank
    </a>

</div>

            <!-- Search -->
            <div class="col-12 col-md-6 order-3 order-md-2 mt-3 mt-md-0">
                <form action="{% url 'search_skills' %}" method="GET">
                    <input class="form-control rounded-pill"
                           type="search"
                           name="q"
                           placeholder="🔍 Search skills..."
                           value="{{ request.GET.q }}">
                </form>
            </div>

            <!-- Right Icons -->
            <div class="col-4 col-md-3 order-2 order-md-3 d-flex justify-content-end align-items-center gap-2">

                <!-- Notifications Bell -->
                <a href="{% url 'notifications' %}" class="btn position-relative" title="Notifications">
                    <i class="bi bi-bell fs-4"></i>
                </a>

                <!-- Messages -->
                <a href="{% url 'messaging_index' %}" class="btn" title="Messages">
                    <i class="bi bi-chat-dots fs-4"></i>
                </a>

                <!-- Profile Dropdown -->
                <div class="dropdown">
                  <a href="#" data-bs-toggle="dropdown" class="profile-avatar" title="{{ user.username }}">
                    <i class="bi bi-person-circle" style="font-size:35px;"></i>
                  </a>

                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><span class="dropdown-item-text fw-bold">{{ user.get_full_name|default:user.username }}</span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="{% url 'profile' %}"><i class="bi bi-person me-2"></i>My Profile</a></li>
                        <li><a class="dropdown-item" href="{% url 'booking_list' %}"><i class="bi bi-calendar-check me-2"></i>My Bookings</a></li>
                        <li><a class="dropdown-item" href="{% url 'ratings:rating_dashboard' %}"><i class="bi bi-star me-2"></i>My Ratings</a></li>
                        {% if user.is_staff %}
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-primary" href="{% url 'admin_panel:dashboard' %}"><i class="bi bi-shield-check me-2"></i>Admin Panel</a></li>
                        {% endif %}
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="{% url 'logout' %}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </div>

            </div>

        </div>

    </div>
</nav>
