{% load static %}

<style>
/* Dashboard navbar logo — permanent fix for all devices */
.db-navbar-brand {
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    text-decoration: none !important;
    font-family: 'Outfit', -apple-system, sans-serif !important;
    font-size: 1.35rem !important;
    font-weight: 900 !important;
    color: #0e7d73 !important;
}
.db-brand-icon {
    background: #0e7d73 !important;
    color: #ffffff !important;
    width: 34px !important;
    height: 34px !important;
    min-width: 34px !important;
    border-radius: 9px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 16px !important;
    font-weight: 800 !important;
    line-height: 1 !important;
    flex-shrink: 0 !important;
}
@media (max-width: 575.98px) {
    .db-navbar-brand { font-size: 1.1rem !important; }
    .db-brand-icon { width: 28px !important; height: 28px !important; min-width: 28px !important; font-size: 13px !important; border-radius: 7px !important; }
}
@media (max-width: 399.98px) {
    .db-navbar-brand { font-size: 0.95rem !important; }
    .db-brand-icon { width: 26px !important; height: 26px !important; min-width: 26px !important; border-radius: 6px !important; }
}
</style>

<nav class="navbar bg-white shadow-sm py-3">
    <div class="container-fluid">

        <div class="row align-items-center w-100">

           <!-- Logo + Hamburger -->
<div class="col-8 col-md-3 d-flex align-items-center">

    <!-- Mobile Sidebar Toggle -->
    <button class="btn d-lg-none me-2"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#sidebarMenu"
            aria-controls="sidebarMenu">

        <i class="bi bi-list fs-2"></i>

    </button>

    <!-- Logo — permanently visible on all devices -->
    <a class="db-navbar-brand" href="{% url 'home' %}">
        <span class="db-brand-icon" aria-hidden="true">S</span>
        <span>SkillBank</span>
    </a>

</div>

            <!-- Search -->
            <div class="col-12 col-md-6 order-3 order-md-2 mt-3 mt-md-0">
                <form action="{% url 'search_skills' %}" method="GET">
                    <input class="form-control rounded-pill"
                           type="search"
                           name="q"
                           placeholder="🔍 Search skills..."
                           value="{{ request.GET.q }}">
                </form>
            </div>

            <!-- Right Icons -->
            <div class="col-4 col-md-3 order-2 order-md-3 d-flex justify-content-end align-items-center gap-2">

                <!-- Notifications Bell -->
                <a href="{% url 'notifications' %}" class="btn position-relative" title="Notifications">
                    <i class="bi bi-bell fs-4"></i>
                </a>

                <!-- Batches -->
                <a href="{% url 'batches' %}" class="btn d-none d-md-inline-flex align-items-center gap-1 fw-semibold" title="Batches" style="color:#0e7d73;">
                    <i class="bi bi-collection-play fs-5"></i>
                    <span class="d-none d-lg-inline" style="font-size:0.9rem;">Batches</span>
                </a>

                <!-- Messages -->
                <a href="{% url 'messaging_index' %}" class="btn" title="Messages">
                    <i class="bi bi-chat-dots fs-4"></i>
                </a>

                <!-- Profile Dropdown -->
                <div class="dropdown">
                  <a href="#" data-bs-toggle="dropdown" class="profile-avatar" title="{{ user.username }}">
                    <i class="bi bi-person-circle" style="font-size:35px;"></i>
                  </a>

                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><span class="dropdown-item-text fw-bold">{{ user.get_full_name|default:user.username }}</span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="{% url 'profile' %}"><i class="bi bi-person me-2"></i>My Profile</a></li>
                        <li><a class="dropdown-item" href="{% url 'booking_list' %}"><i class="bi bi-calendar-check me-2"></i>My Bookings</a></li>
                        <li><a class="dropdown-item" href="{% url 'my_certificates' %}"><i class="bi bi-award me-2"></i>My Certificates</a></li>
                        <li><a class="dropdown-item" href="{% url 'ratings:rating_dashboard' %}"><i class="bi bi-star me-2"></i>My Ratings</a></li>
                        {% if user.is_staff %}
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-primary" href="{% url 'admin_panel:dashboard' %}"><i class="bi bi-shield-check me-2"></i>Admin Panel</a></li>
                        {% endif %}
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="{% url 'logout' %}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </div>

            </div>

        </div>

    </div>
</nav>
